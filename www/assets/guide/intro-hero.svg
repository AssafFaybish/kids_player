<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="מסך מסודר של סרטונים מאושרים, מוגן מפני תוכן אקראי">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f0ff"/>
      <stop offset="1" stop-color="#faf8ff"/>
    </linearGradient>
    <linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c63ff"/>
      <stop offset="1" stop-color="#8a84c8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2d2a4a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="800" rx="28" fill="url(#sky)"/>

  <!-- ===== chaotic, unfiltered content on the OUTSIDE (left) ===== -->
  <g opacity="0.5">
    <rect x="62" y="120" width="150" height="96" rx="12" fill="#c9c4e4"/>
    <rect x="94" y="246" width="150" height="96" rx="12" fill="#d6c4d8" transform="rotate(-9 169 294)"/>
    <rect x="56" y="386" width="150" height="96" rx="12" fill="#c4cee4" transform="rotate(7 131 434)"/>
    <rect x="104" y="522" width="150" height="96" rx="12" fill="#d8cec4" transform="rotate(-5 179 570)"/>
    <rect x="66" y="650" width="150" height="96" rx="12" fill="#c9c4e4" transform="rotate(4 141 698)"/>
    <!-- ad / noise marks -->
    <g fill="#8b86a8">
      <circle cx="255" cy="176" r="15"/>
      <circle cx="286" cy="330" r="11"/>
      <circle cx="243" cy="452" r="13"/>
      <circle cx="292" cy="596" r="10"/>
    </g>
  </g>

  <!-- ===== the shield: parents decide what gets through ===== -->
  <g filter="url(#soft)">
    <path d="M404 128 L404 470 Q404 610 470 686 Q536 610 536 470 L536 128 Z"
          fill="#ffffff" stroke="#6c63ff" stroke-width="7" stroke-linejoin="round"/>
    <path d="M441 402 l22 24 l50 -60" fill="none" stroke="#0f9d58"
          stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== the child's tidy, approved home screen (right) ===== -->
  <g filter="url(#soft)">
    <rect x="640" y="96" width="580" height="612" rx="40" fill="#ffffff"/>
    <rect x="640" y="96" width="580" height="92" rx="40" fill="url(#brandg)"/>
    <rect x="640" y="150" width="580" height="38" fill="url(#brandg)"/>

    <!-- header: avatar + search -->
    <circle cx="1160" cy="142" r="28" fill="#ffffff" opacity="0.92"/>
    <circle cx="1160" cy="136" r="10" fill="#6c63ff"/>
    <path d="M1146 156 q14 -14 28 0" fill="none" stroke="#6c63ff" stroke-width="7" stroke-linecap="round"/>
    <g stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round">
      <circle cx="708" cy="138" r="17"/>
      <line x1="721" y1="151" x2="734" y2="164"/>
    </g>

    <!-- approved tiles -->
    <g>
      <rect x="678" y="230" width="240" height="152" rx="20" fill="#eae7ff"/>
      <circle cx="798" cy="306" r="36" fill="#6c63ff"/>
      <path d="M787 289 l26 17 l-26 17 Z" fill="#ffffff"/>

      <rect x="942" y="230" width="240" height="152" rx="20" fill="#e6f6ec"/>
      <circle cx="1062" cy="306" r="36" fill="#0f9d58"/>
      <path d="M1051 289 l26 17 l-26 17 Z" fill="#ffffff"/>

      <rect x="678" y="410" width="240" height="152" rx="20" fill="#fff3d9"/>
      <circle cx="798" cy="486" r="36" fill="#f0b429"/>
      <path d="M787 469 l26 17 l-26 17 Z" fill="#ffffff"/>

      <!-- gift-wrapped new video -->
      <rect x="942" y="410" width="240" height="152" rx="20" fill="#ffe9ef"/>
      <rect x="1032" y="446" width="60" height="60" rx="8" fill="#ff6b95"/>
      <rect x="1055" y="446" width="14" height="60" fill="#ffffff"/>
      <rect x="1032" y="469" width="60" height="14" fill="#ffffff"/>
      <path d="M1062 446 q-20 -22 -34 -8 q-8 10 12 12 M1062 446 q20 -22 34 -8 q8 10 -12 12"
            fill="none" stroke="#ff6b95" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- bottom label bars -->
    <rect x="678" y="600" width="330" height="20" rx="10" fill="#e7e4f5"/>
    <rect x="678" y="638" width="220" height="20" rx="10" fill="#efedf9"/>
  </g>

  <!-- caption -->
  <text x="640" y="762" direction="rtl" text-anchor="middle" fill="#2d2a4a"
        font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif"
        font-size="34" font-weight="700">אתם בוחרים · הילד צופה בשקט</text>
</svg>
