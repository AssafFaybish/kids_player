<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="ttl">
  <title id="ttl">הדבקת קישור בתא ריק בשורה חדשה בגיליון</title>
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2d2a4a" flood-opacity="0.16"/>
    </filter>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6c63ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="800" rx="28" fill="#faf8ff"/>
  <circle cx="170" cy="340" r="78" fill="#6c63ff" opacity="0.07"/>
  <circle cx="1155" cy="735" r="95" fill="#f0b429" opacity="0.08"/>
  <circle cx="70" cy="740" r="60" fill="#6c63ff" opacity="0.06"/>

  <!-- ============ instruction label ============ -->
  <g font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" text-anchor="middle" direction="rtl" font-weight="700">
    <text x="300" y="170" font-size="40" fill="#2d2a4a">מדביקים לינק</text>
    <text x="300" y="226" font-size="40" fill="#4f46b8">בשורה חדשה</text>
  </g>

  <!-- ============ clipboard card ============ -->
  <g filter="url(#soft)">
    <rect x="560" y="110" width="600" height="150" rx="26" fill="#ffffff" stroke="#e0dbf3" stroke-width="2"/>
  </g>
  <rect x="798" y="86" width="124" height="46" rx="16" fill="#c7c2dd"/>
  <rect x="820" y="76" width="80" height="28" rx="12" fill="none" stroke="#9a95b8" stroke-width="7"/>

  <circle cx="614" cy="185" r="26" fill="#6c63ff"/>
  <polygon points="606,172 606,198 628,185" fill="#ffffff"/>
  <text x="660" y="196" direction="ltr" text-anchor="start" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="30" fill="#2d2a4a">youtube.com/watch?v=...</text>
  <rect x="1032" y="165" width="100" height="40" rx="20" fill="#e6f5ec"/>
  <text x="1082" y="192" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f9d58">הועתק</text>

  <!-- ============ spreadsheet close-up ============ -->
  <g filter="url(#soft)">
    <rect x="120" y="420" width="880" height="260" rx="14" fill="#ffffff"/>
  </g>
  <rect x="120" y="480" width="60" height="200" fill="#f6f4fd"/>
  <rect x="120" y="420" width="880" height="60" fill="#efecfb"/>

  <g stroke="#e4dff5" stroke-width="2">
    <line x1="120" y1="480" x2="1000" y2="480"/>
    <line x1="120" y1="580" x2="1000" y2="580"/>
    <line x1="180" y1="420" x2="180" y2="680"/>
    <line x1="680" y1="420" x2="680" y2="680"/>
  </g>
  <rect x="120" y="420" width="880" height="260" fill="none" stroke="#d5cfee" stroke-width="2" rx="4"/>

  <g font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="22" font-weight="700" fill="#6b6890" text-anchor="middle">
    <text x="430" y="458">A</text>
    <text x="840" y="458">B</text>
  </g>
  <g font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="24" fill="#9a96b8" text-anchor="middle">
    <text x="150" y="539">1</text>
    <text x="150" y="639">2</text>
  </g>

  <!-- filled row 1 -->
  <text x="204" y="539" direction="ltr" text-anchor="start" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="26" fill="#6b6890">youtube.com/watch?v=...</text>
  <text x="840" y="539" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="26" fill="#2d2a4a">שיר לילדים</text>

  <!-- selected empty cell A2 -->
  <rect x="180" y="580" width="500" height="100" fill="#ffffff"/>
  <rect x="180" y="580" width="500" height="100" fill="none" stroke="#6c63ff" stroke-width="4"/>
  <rect x="671" y="671" width="18" height="18" rx="3" fill="#6c63ff" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="212" y1="602" x2="212" y2="658" stroke="#2d2a4a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ============ dashed paste arrow (drawn last, lands inside the empty cell) ============ -->
  <path d="M706 272 C 700 380, 664 470, 620 576" fill="none" stroke="#6c63ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 11" marker-end="url(#ah)"/>
</svg>
