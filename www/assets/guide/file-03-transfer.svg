<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t3">
  <title id="t3">אותו קובץ מייבאים בטאבלט אחר — והספרייה נבנית שם</title>
  <defs>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6c63ff" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="#fdf6e6"/>
  <text x="640" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#6c63ff">
    להעביר ספרייה שלמה למכשיר אחר
  </text>

  <!-- tablet A -->
  <g filter="url(#sh3)">
    <rect x="90" y="170" width="330" height="420" rx="30" fill="#ffffff" stroke="#e3e0f5" stroke-width="3"/>
  </g>
  <text x="255" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="800" fill="#6c63ff">הטאבלט הראשון</text>
  <g>
    <rect x="120" y="246" width="126" height="112" rx="18" fill="#f2f0ff" stroke="#dcd7f7" stroke-width="2"/>
    <text x="183" y="316" text-anchor="middle" font-size="46">📺</text>
    <rect x="264" y="246" width="126" height="112" rx="18" fill="#f2f0ff" stroke="#dcd7f7" stroke-width="2"/>
    <text x="327" y="316" text-anchor="middle" font-size="46">📺</text>
    <rect x="120" y="374" width="126" height="112" rx="18" fill="#f2f0ff" stroke="#dcd7f7" stroke-width="2"/>
    <text x="183" y="444" text-anchor="middle" font-size="46">⭐</text>
    <rect x="264" y="374" width="126" height="112" rx="18" fill="#fff6e0" stroke="#f0dfae" stroke-width="2"/>
    <text x="327" y="444" text-anchor="middle" font-size="46">🎁</text>
  </g>
  <text x="255" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#7b74a8">📤 ייצוא</text>

  <!-- the file travelling -->
  <g stroke="#6c63ff" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="16 12">
    <path d="M446 380 H 560"/>
  </g>
  <g filter="url(#sh3)">
    <rect x="566" y="288" width="148" height="184" rx="16" fill="#ffffff" stroke="#c9c2ff" stroke-width="3"/>
  </g>
  <path d="M684 288 L 714 318 L 684 318 Z" fill="#e9e6fb"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9a94c4">
    <text x="586" y="330">#  פרופיל: נועם</text>
  </g>
  <g stroke="#cfc9f2" stroke-width="6" stroke-linecap="round">
    <path d="M586 352 H 690"/><path d="M586 374 H 672"/><path d="M586 396 H 694"/><path d="M586 418 H 660"/>
  </g>
  <text x="640" y="504" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#4b3fd6">קובץ לינקים</text>
  <g stroke="#6c63ff" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="16 12">
    <path d="M720 380 H 834"/>
  </g>
  <g stroke="#6c63ff" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M814 358 L 836 380 L 814 402"/>
  </g>

  <!-- tablet B, filling in -->
  <g filter="url(#sh3)">
    <rect x="860" y="170" width="330" height="420" rx="30" fill="#ffffff" stroke="#e3e0f5" stroke-width="3"/>
  </g>
  <text x="1025" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="800" fill="#6c63ff">הטאבלט השני</text>
  <g>
    <rect x="890" y="246" width="126" height="112" rx="18" fill="#f2f0ff" stroke="#dcd7f7" stroke-width="2"/>
    <text x="953" y="316" text-anchor="middle" font-size="46">📺</text>
    <rect x="1034" y="246" width="126" height="112" rx="18" fill="#f2f0ff" stroke="#dcd7f7" stroke-width="2"/>
    <text x="1097" y="316" text-anchor="middle" font-size="46">📺</text>
    <rect x="890" y="374" width="126" height="112" rx="18" fill="#f2f0ff" stroke="#dcd7f7" stroke-width="2"/>
    <text x="953" y="444" text-anchor="middle" font-size="46">⭐</text>
    <rect x="1034" y="374" width="126" height="112" rx="18" fill="#fff6e0" stroke="#f0dfae" stroke-width="2"/>
    <text x="1097" y="444" text-anchor="middle" font-size="46">🎁</text>
  </g>
  <text x="1025" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#7b74a8">📥 ייבוא</text>

  <text x="640" y="666" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#4a4470">
    עובד גם בין חשבונות גוגל שונים — ואפשר גם ליצור פרופיל חדש ישר מהקובץ
  </text>
  <text x="640" y="716" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" fill="#7b74a8">
    סרטונים של ערוץ ימתינו לאישור, כרגיל
  </text>
</svg>
