<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="ttl">
  <title id="ttl">שלוש העמודות בקובץ הרשימה: קישור, שם להצגה, אוטומטי או ידני</title>
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2d2a4a" flood-opacity="0.16"/>
    </filter>
    <filter id="softsm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2d2a4a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="800" rx="28" fill="#faf8ff"/>
  <circle cx="34" cy="46" r="70" fill="#6c63ff" opacity="0.06"/>
  <circle cx="1252" cy="52" r="60" fill="#f0b429" opacity="0.08"/>

  <text x="640" y="84" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="36" font-weight="700" fill="#2d2a4a">מה כותבים בכל עמודה?</text>

  <!-- ============ the spreadsheet ============ -->
  <g filter="url(#soft)">
    <rect x="60" y="140" width="800" height="470" rx="6" fill="#ffffff"/>
  </g>
  <rect x="60" y="140" width="800" height="50" fill="#efecfb"/>
  <rect x="60" y="190" width="50" height="420" fill="#f6f4fd"/>

  <!-- column tints, matching the legend chips -->
  <rect x="110" y="260" width="390" height="350" fill="#6c63ff" opacity="0.05"/>
  <rect x="500" y="260" width="170" height="350" fill="#f0b429" opacity="0.08"/>
  <rect x="670" y="260" width="190" height="350" fill="#0f9d58" opacity="0.06"/>

  <!-- frozen header row -->
  <rect x="110" y="190" width="750" height="70" fill="#f1eefc"/>
  <!-- the ignored comment row -->
  <rect x="110" y="540" width="750" height="70" fill="#f0eef6"/>

  <g stroke="#e4dff5" stroke-width="2">
    <line x1="60" y1="190" x2="860" y2="190"/>
    <line x1="60" y1="260" x2="860" y2="260"/>
    <line x1="60" y1="330" x2="860" y2="330"/>
    <line x1="60" y1="400" x2="860" y2="400"/>
    <line x1="60" y1="470" x2="860" y2="470"/>
    <line x1="60" y1="540" x2="860" y2="540"/>
    <line x1="110" y1="140" x2="110" y2="610"/>
    <line x1="500" y1="140" x2="500" y2="610"/>
    <line x1="670" y1="140" x2="670" y2="610"/>
  </g>
  <rect x="60" y="140" width="800" height="470" fill="none" stroke="#d5cfee" stroke-width="2"/>

  <!-- spreadsheet column letters -->
  <g font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="22" font-weight="700" fill="#6b6890" text-anchor="middle">
    <text x="305" y="176">A</text>
    <text x="585" y="176">B</text>
    <text x="765" y="176">C</text>
  </g>
  <!-- row numbers -->
  <g font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="22" fill="#9a96b8" text-anchor="middle">
    <text x="85" y="233">1</text>
    <text x="85" y="303">2</text>
    <text x="85" y="373">3</text>
    <text x="85" y="443">4</text>
    <text x="85" y="513">5</text>
    <text x="85" y="583">6</text>
  </g>

  <!-- header row 1: the real column titles -->
  <g direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-weight="700" fill="#2d2a4a">
    <text x="305" y="233" font-size="25">קישור</text>
    <text x="585" y="233" font-size="24">שם להצגה</text>
    <text x="765" y="233" font-size="22">אוטומטי / ידני</text>
  </g>

  <!-- column A: the links (LTR) -->
  <g font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="23" direction="ltr" text-anchor="start">
    <text x="134" y="303" fill="#6b6890">youtube.com/watch?v=...</text>
    <text x="134" y="373" fill="#0f7f4c">youtube.com/@kids-songs</text>
    <text x="134" y="443" fill="#0f7f4c">youtube.com/@stories</text>
    <text x="134" y="513" fill="#6b6890">youtu.be/...</text>
  </g>

  <!-- column B: display names (optional) -->
  <g direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="23" fill="#2d2a4a">
    <text x="585" y="303">שיר לילדים</text>
    <text x="585" y="373">ערוץ שירים</text>
    <text x="585" y="443">ערוץ סיפורים</text>
  </g>

  <!-- column C: auto / manual — channel rows only -->
  <rect x="712" y="352" width="106" height="40" rx="20" fill="#e6f5ec"/>
  <text x="765" y="379" direction="ltr" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f7f4c">auto</text>
  <rect x="700" y="422" width="130" height="40" rx="20" fill="#ece8f8"/>
  <text x="765" y="449" direction="ltr" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="22" font-weight="700" fill="#6b6890">manual</text>

  <!-- row 6: a comment row the app skips. The '#' is its own element so it always
       sits at the RTL reading start (the right edge of the cell), never re-ordered. -->
  <text x="474" y="583" direction="ltr" text-anchor="end" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="25" font-weight="700" fill="#9a96b8">#</text>
  <text x="303" y="583" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="23" fill="#9a96b8">הערה — לא נכנסת לאפליקציה</text>

  <!-- ============ legend: what each column means ============ -->
  <g filter="url(#softsm)">
    <rect x="900" y="140" width="320" height="470" rx="22" fill="#ffffff" stroke="#e0dbf3" stroke-width="2"/>
  </g>
  <text x="1060" y="188" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="24" font-weight="700" fill="#6b6890">מקרא</text>
  <line x1="924" y1="206" x2="1196" y2="206" stroke="#ece8f8" stroke-width="2"/>

  <!-- A -->
  <rect x="1136" y="222" width="54" height="48" rx="12" fill="#ede9ff"/>
  <text x="1163" y="256" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="26" font-weight="700" fill="#4f46b8">A</text>
  <text x="1020" y="248" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="28" font-weight="700" fill="#2d2a4a">קישור</text>
  <text x="1020" y="280" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="21" font-weight="700" fill="#4f46b8">(חובה)</text>

  <!-- B -->
  <rect x="1136" y="312" width="54" height="48" rx="12" fill="#fff3d9"/>
  <text x="1163" y="346" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="26" font-weight="700" fill="#2d2a4a">B</text>
  <text x="1020" y="338" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="28" font-weight="700" fill="#2d2a4a">שם להצגה</text>
  <text x="1020" y="370" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="21" fill="#6b6890">(לא חובה)</text>

  <!-- C -->
  <rect x="1136" y="402" width="54" height="48" rx="12" fill="#e6f6ec"/>
  <text x="1163" y="436" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f7f4c">C</text>
  <text x="1020" y="428" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="25" font-weight="700" fill="#2d2a4a">אוטומטי / ידני</text>
  <text x="1020" y="460" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="21" fill="#6b6890">(לא חובה)</text>

  <rect x="908" y="486" width="304" height="104" rx="18" fill="#f6f4fd"/>
  <text x="1060" y="516" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="21" font-weight="700" fill="#4f46b8">רק עמודה A היא חובה</text>
  <text x="1060" y="546" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="20" fill="#6b6890">עמודה C: auto או manual</text>
  <text x="1060" y="574" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="20" fill="#6b6890">(רק בשורת ערוץ)</text>

  <!-- ============ the comment-row note ============ -->
  <rect x="60" y="640" width="1160" height="84" rx="24" fill="#f0eef6" stroke="#e0dbf3" stroke-width="2"/>
  <circle cx="1150" cy="682" r="30" fill="#ffffff" stroke="#d5cfee" stroke-width="2"/>
  <text x="1150" y="694" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="32" font-weight="700" fill="#9a96b8">#</text>
  <text x="600" y="692" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="26" fill="#6b6890">שורה שמתחילה בסולמית # היא הערה — האפליקציה מדלגת עליה</text>
</svg>
