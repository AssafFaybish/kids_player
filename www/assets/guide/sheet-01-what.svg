<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="ttl">
  <title id="ttl">גיליון אלקטרוני שבו כל שורה היא סרטון או ערוץ</title>
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2d2a4a" flood-opacity="0.16"/>
    </filter>
    <filter id="softsm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2d2a4a" flood-opacity="0.12"/>
    </filter>
    <clipPath id="win">
      <rect x="60" y="130" width="860" height="590" rx="22"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1280" height="800" rx="28" fill="#faf8ff"/>
  <circle cx="1210" cy="760" r="80" fill="#0f9d58" opacity="0.07"/>
  <circle cx="60" cy="770" r="70" fill="#6c63ff" opacity="0.07"/>

  <text x="640" y="86" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="38" font-weight="700" fill="#2d2a4a">שורה = סרטון או ערוץ</text>

  <!-- ============ browser window ============ -->
  <g filter="url(#soft)">
    <rect x="60" y="130" width="860" height="590" rx="22" fill="#ffffff" stroke="#e0dbf3" stroke-width="2"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="60" y="130" width="860" height="60" fill="#f1eefc"/>
  </g>
  <line x1="60" y1="190" x2="920" y2="190" stroke="#e0dbf3" stroke-width="2"/>
  <circle cx="96" cy="160" r="9" fill="#ff6b6b"/>
  <circle cx="128" cy="160" r="9" fill="#f0b429"/>
  <circle cx="160" cy="160" r="9" fill="#0f9d58"/>
  <rect x="200" y="146" width="420" height="28" rx="14" fill="#e2ddf3"/>
  <rect x="836" y="146" width="28" height="28" rx="8" fill="#e2ddf3"/>
  <rect x="876" y="146" width="28" height="28" rx="8" fill="#e2ddf3"/>

  <!-- ============ spreadsheet grid ============ -->
  <rect x="80" y="210" width="820" height="472" fill="#ffffff"/>
  <rect x="80" y="262" width="56" height="420" fill="#f6f4fd"/>
  <rect x="80" y="210" width="820" height="52" fill="#efecfb"/>
  <rect x="80" y="346" width="820" height="84" fill="#0f9d58" opacity="0.09"/>
  <rect x="80" y="514" width="820" height="84" fill="#6c63ff" opacity="0.09"/>

  <g stroke="#e4dff5" stroke-width="2">
    <line x1="80" y1="262" x2="900" y2="262"/>
    <line x1="80" y1="346" x2="900" y2="346"/>
    <line x1="80" y1="430" x2="900" y2="430"/>
    <line x1="80" y1="514" x2="900" y2="514"/>
    <line x1="80" y1="598" x2="900" y2="598"/>
    <line x1="136" y1="210" x2="136" y2="682"/>
    <line x1="600" y1="210" x2="600" y2="682"/>
  </g>
  <rect x="80" y="210" width="820" height="472" fill="none" stroke="#d5cfee" stroke-width="2"/>

  <!-- column letters -->
  <g font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="22" font-weight="700" fill="#6b6890" text-anchor="middle">
    <text x="368" y="248">A</text>
    <text x="750" y="248">B</text>
  </g>
  <!-- row numbers -->
  <g font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="22" fill="#9a96b8" text-anchor="middle">
    <text x="108" y="312">1</text>
    <text x="108" y="396">2</text>
    <text x="108" y="480">3</text>
    <text x="108" y="564">4</text>
    <text x="108" y="648">5</text>
  </g>
  <!-- column A: links (LTR) -->
  <g font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="23" fill="#6b6890" direction="ltr" text-anchor="start">
    <text x="160" y="312">youtube.com/watch?v=...</text>
    <text x="160" y="396" fill="#0f7f4c">youtube.com/@...</text>
    <text x="160" y="480">youtube.com/watch?v=...</text>
    <text x="160" y="564" fill="#4f46b8">youtube.com/watch?v=...</text>
    <text x="160" y="648">youtube.com/watch?v=...</text>
  </g>
  <!-- column B: Hebrew titles -->
  <g font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="25" fill="#2d2a4a" direction="rtl" text-anchor="middle">
    <text x="720" y="313">שיר לילדים</text>
    <text x="720" y="397">ערוץ מוזיקה</text>
    <text x="720" y="481">סיפור קצר</text>
    <text x="720" y="565">פעילות יצירה</text>
    <text x="720" y="649">שיר בוקר</text>
  </g>

  <!-- row 2 tag: channel (stylized TV on a stand) -->
  <g stroke="#0f9d58" stroke-width="4" stroke-linecap="round">
    <line x1="868" y1="400" x2="868" y2="406"/>
    <line x1="856" y1="407" x2="880" y2="407"/>
  </g>
  <rect x="848" y="370" width="40" height="30" rx="8" fill="#0f9d58"/>
  <polygon points="862,377 862,393 876,385" fill="#ffffff"/>

  <!-- row 4 tag: video -->
  <circle cx="868" cy="556" r="18" fill="#6c63ff"/>
  <polygon points="862,547 862,565 877,556" fill="#ffffff"/>

  <!-- ============ legend ============ -->
  <path d="M964 458 C 938 428, 918 402, 896 391" fill="none" stroke="#0f9d58" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.55" stroke-linecap="round"/>
  <path d="M964 533 C 940 543, 918 552, 896 556" fill="none" stroke="#6c63ff" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.55" stroke-linecap="round"/>

  <g filter="url(#softsm)">
    <rect x="970" y="350" width="250" height="240" rx="22" fill="#ffffff" stroke="#e0dbf3" stroke-width="2"/>
  </g>
  <text x="1095" y="398" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="24" font-weight="700" fill="#6b6890">מקרא</text>

  <g stroke="#0f9d58" stroke-width="4" stroke-linecap="round">
    <line x1="1180" y1="472" x2="1180" y2="478"/>
    <line x1="1168" y1="479" x2="1192" y2="479"/>
  </g>
  <rect x="1160" y="442" width="40" height="30" rx="8" fill="#0f9d58"/>
  <polygon points="1174,449 1174,465 1188,457" fill="#ffffff"/>
  <text x="1075" y="470" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="28" font-weight="600" fill="#2d2a4a">ערוץ</text>

  <circle cx="1180" cy="535" r="18" fill="#6c63ff"/>
  <polygon points="1174,526 1174,544 1189,535" fill="#ffffff"/>
  <text x="1075" y="545" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="28" font-weight="600" fill="#2d2a4a">סרטון</text>
</svg>
