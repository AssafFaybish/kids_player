<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t1">
  <title id="t1">קובץ לינקים — שורה אחת לכל סרטון או ערוץ</title>
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f5ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6c63ff" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="#fdf6e6"/>

  <!-- the file itself: a plain text document, deliberately NOT a spreadsheet -->
  <g filter="url(#sh)">
    <rect x="96" y="120" width="620" height="560" rx="24" fill="url(#pg)" stroke="#e3e0f5" stroke-width="3"/>
  </g>
  <!-- dog-eared corner, so it reads as a file and not a panel -->
  <path d="M656 120 L716 180 L656 180 Z" fill="#e9e6fb"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">
    <text x="132" y="182" fill="#9a94c4"># הסרטונים שלי — רשימת לינקים</text>
    <text x="132" y="212" fill="#9a94c4"># פרופיל: נועם</text>
    <text x="132" y="242" fill="#9a94c4"># שורה אחת = לינק אחד</text>

    <text x="132" y="300" fill="#2f2a52" direction="ltr">youtube.com/@SuperSimple<tspan fill="#6c63ff">,שירים,auto</tspan></text>
    <text x="132" y="346" fill="#2f2a52" direction="ltr">youtube.com/watch?v=AAAA</text>
    <text x="132" y="392" fill="#2f2a52" direction="ltr">youtube.com/playlist?list=PL1</text>
    <text x="132" y="438" fill="#2f2a52" direction="ltr">youtube.com/watch?v=BBBB</text>
    <text x="132" y="484" fill="#2f2a52" direction="ltr">example.com/שיר.mp4</text>
  </g>
  <!-- the callout on the optional extra columns -->
  <g>
    <rect x="132" y="530" width="500" height="112" rx="16" fill="#eceaff" stroke="#c9c2ff" stroke-width="2"/>
    <text x="156" y="568" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#4b3fd6">אחרי פסיק (לא חייבים):</text>
    <text x="156" y="600" font-family="system-ui, sans-serif" font-size="19" fill="#4a4470">שם להצגה, ואז auto לערוץ שנכנס בלי אישור</text>
    <text x="156" y="628" font-family="system-ui, sans-serif" font-size="19" fill="#4a4470">שורה שמתחילה ב-# היא הערה ומדולגת</text>
  </g>

  <!-- arrow into the tablet -->
  <g stroke="#6c63ff" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M756 400 H 872"/>
    <path d="M852 378 L 874 400 L 852 422"/>
  </g>

  <!-- the child's home -->
  <g filter="url(#sh)">
    <rect x="900" y="196" width="300" height="410" rx="28" fill="#ffffff" stroke="#e3e0f5" stroke-width="3"/>
  </g>
  <text x="1050" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#6c63ff">הסרטונים שלי 🌳</text>
  <g>
    <rect x="928" y="276" width="112" height="112" rx="18" fill="#f2f0ff" stroke="#dcd7f7" stroke-width="2"/>
    <text x="984" y="346" text-anchor="middle" font-size="46">📺</text>
    <rect x="1060" y="276" width="112" height="112" rx="18" fill="#f2f0ff" stroke="#dcd7f7" stroke-width="2"/>
    <text x="1116" y="346" text-anchor="middle" font-size="46">⭐</text>
    <rect x="928" y="404" width="112" height="112" rx="18" fill="#fff6e0" stroke="#f0dfae" stroke-width="2"/>
    <text x="984" y="474" text-anchor="middle" font-size="46">🎁</text>
    <rect x="1060" y="404" width="112" height="112" rx="18" fill="#f2f0ff" stroke="#dcd7f7" stroke-width="2"/>
    <text x="1116" y="474" text-anchor="middle" font-size="46">📺</text>
  </g>
  <text x="1050" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#7b74a8">מה שבקובץ — מגיע לילד</text>

  <text x="640" y="726" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#4a4470">
    קובץ טקסט פשוט · נפתח בכל עורך · שום דבר לא מועלה לאף מקום
  </text>
</svg>
