<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="ttl">
  <title id="ttl">מסך אישור הוספת סרטון עם קוד הורים</title>
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2d2a4a" flood-opacity="0.18"/>
    </filter>
    <filter id="softsm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2d2a4a" flood-opacity="0.14"/>
    </filter>
    <clipPath id="scr">
      <rect x="458" y="62" width="364" height="676" rx="30"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1280" height="800" rx="28" fill="#faf8ff"/>
  <rect x="378" y="86" width="524" height="628" rx="64" fill="#6c63ff" opacity="0.05"/>
  <circle cx="170" cy="180" r="105" fill="#6c63ff" opacity="0.07"/>
  <circle cx="1110" cy="200" r="80" fill="#f0b429" opacity="0.09"/>
  <circle cx="1140" cy="640" r="120" fill="#6c63ff" opacity="0.06"/>
  <circle cx="150" cy="650" r="80" fill="#f0b429" opacity="0.07"/>

  <!-- ============ phone ============ -->
  <g filter="url(#soft)">
    <rect x="440" y="40" width="400" height="720" rx="46" fill="#ffffff" stroke="#2d2a4a" stroke-width="4"/>
  </g>
  <rect x="595" y="48" width="90" height="8" rx="4" fill="#d3cee8"/>
  <rect x="585" y="746" width="110" height="6" rx="3" fill="#d3cee8"/>
  <rect x="458" y="62" width="364" height="676" rx="30" fill="#faf8ff"/>

  <g clip-path="url(#scr)">
    <!-- app top bar -->
    <rect x="458" y="62" width="364" height="52" fill="#ffffff"/>
    <line x1="458" y1="114" x2="822" y2="114" stroke="#ece8f8" stroke-width="2"/>
    <polyline points="792,79 802,88 792,97" fill="none" stroke="#4f46b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="478" y="82" width="120" height="12" rx="6" fill="#e3dff5"/>
  </g>

  <!-- lock + label -->
  <rect x="696" y="156" width="44" height="36" rx="8" fill="#6c63ff"/>
  <path d="M706 156 L706 146 A12 12 0 0 1 730 146 L730 156" fill="none" stroke="#6c63ff" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="718" cy="170" r="4.6" fill="#ffffff"/>
  <rect x="716" y="172" width="4" height="10" rx="2" fill="#ffffff"/>
  <text x="604" y="185" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="30" font-weight="700" fill="#4f46b8">קוד הורים</text>

  <!-- ============ confirm card ============ -->
  <g filter="url(#softsm)">
    <rect x="478" y="222" width="324" height="440" rx="26" fill="#ffffff" stroke="#ece8f8" stroke-width="2"/>
  </g>

  <rect x="502" y="246" width="276" height="155" rx="14" fill="#2d2a4a"/>
  <polygon points="620,297 620,350 666,323" fill="#ffffff"/>

  <text x="640" y="464" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="30" font-weight="700" fill="#2d2a4a">להוסיף את הסרטון?</text>
  <rect x="560" y="486" width="160" height="12" rx="6" fill="#ded9f2"/>

  <!-- approve (filled) -->
  <rect x="649" y="552" width="129" height="68" rx="18" fill="#6c63ff"/>
  <text x="713" y="596" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">אישור</text>
  <!-- cancel (outlined) -->
  <rect x="502" y="552" width="129" height="68" rx="18" fill="#ffffff" stroke="#c9c3ec" stroke-width="3"/>
  <text x="566" y="596" direction="rtl" text-anchor="middle" font-family="-apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif" font-size="28" font-weight="700" fill="#4f46b8">ביטול</text>
</svg>
