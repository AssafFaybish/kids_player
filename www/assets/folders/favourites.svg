<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="מועדפים">
  <!-- v1.0.40 — the ⭐ folder's art (user request: a kids' scene combining a rainbow,
       laughing children and a horse, instead of a bare emoji).
       TWO CONSTRAINTS DECIDED THE COMPOSITION, and the first version broke both:
       1. SIZE. This renders in a 104px circle (72px in the 560px media query), so a shape
          must be ~35 units of 120 to be recognisable — the first draft's 22-unit faces came
          out ~7px on screen, i.e. mud. Hence FEW, BIG elements.
       2. THE CIRCULAR CLIP. Corners are cut, so everything must stay within ~52 units of
          the centre; the first draft's sun and second child sat at radius 54+ and were
          sliced. The rainbow is the dominant shape because it survives any size.
       Self-contained: no external refs, no fonts, no filters. -->
  <defs>
    <clipPath id="fav-round"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>
  <g clip-path="url(#fav-round)">
    <rect width="120" height="120" fill="#d9f0ff"/>
    <circle cx="30" cy="28" r="11" fill="#ffd76b"/>

    <!-- rainbow: the anchor of the whole tile — five fat bands, readable at any size -->
    <g fill="none" stroke-width="7" stroke-linecap="round">
      <path d="M12 80a48 48 0 0 1 96 0" stroke="#ff6b6b"/>
      <path d="M20 80a40 40 0 0 1 80 0" stroke="#ffa94d"/>
      <path d="M28 80a32 32 0 0 1 64 0" stroke="#ffd93d"/>
      <path d="M36 80a24 24 0 0 1 48 0" stroke="#6bcb77"/>
      <path d="M44 80a16 16 0 0 1 32 0" stroke="#6c9cff"/>
    </g>

    <!-- meadow -->
    <path d="M0 82c20-6 40-6 60-2s40 4 60-2v42H0z" fill="#a8e6a1"/>

    <!-- horse, bottom-left: bold body, thick legs, no fine detail -->
    <g fill="#a8703f">
      <rect x="14" y="88" width="30" height="16" rx="7"/>
      <path d="M38 90l6-14 7 3-5 13z"/>
      <circle cx="47" cy="79" r="9"/>
      <path d="M42 71l-2-7 6 4zM52 71l4-7 1 7z"/>
    </g>
    <g fill="#8a5a30">
      <rect x="17" y="101" width="6" height="11" rx="3"/>
      <rect x="34" y="101" width="6" height="11" rx="3"/>
      <path d="M14 90l-7-5 2 12z"/>
    </g>
    <circle cx="50" cy="78" r="2" fill="#3a2416"/>

    <!-- two laughing children: BIG heads (r 17 and 13), both well inside the clip -->
    <g>
      <circle cx="92" cy="90" r="13" fill="#f6c9a0" stroke="#d99a6c" stroke-width="2.5"/>
      <path d="M79 88a13 13 0 0 1 26 0z" fill="#2f2f3a"/>
      <circle cx="87" cy="91" r="2.1" fill="#3a2416"/>
      <circle cx="97" cy="91" r="2.1" fill="#3a2416"/>
      <path d="M86 97a7 7 0 0 0 12 0z" fill="#fff" stroke="#c86a6a" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <g>
      <circle cx="70" cy="94" r="17" fill="#ffd9b3" stroke="#e0a878" stroke-width="2.5"/>
      <path d="M53 92a17 17 0 0 1 34 0z" fill="#5a3a22"/>
      <circle cx="63" cy="95" r="2.6" fill="#3a2416"/>
      <circle cx="77" cy="95" r="2.6" fill="#3a2416"/>
      <path d="M62 102a9 9 0 0 0 16 0z" fill="#fff" stroke="#c86a6a" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="55" cy="100" r="3" fill="#ffb3b3" opacity="0.75"/>
      <circle cx="85" cy="100" r="3" fill="#ffb3b3" opacity="0.75"/>
    </g>
  </g>
</svg>
